#
# virtio-gpu driver configuration
#
# PCI device binding:
#   Vendor: 0x1af4 (Red Hat / virtio)
#   Device: 0x1050 (virtio-gpu, modern/transitional)
#   Also matches legacy device 0x1040 + subsystem device 0x0010
#
# The driver will be matched by the PCI alias mechanism or by
# explicit add_drv binding:
#   add_drv -i '"pci1af4,1050"' virtio_gpu
#
